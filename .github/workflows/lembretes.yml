name: Lembretes automáticos

# RESERVA. O disparo principal dos lembretes é o cron-job.org, a cada 15 min.
#
# Este workflow já foi o principal, e não deu conta: o cron do GitHub é "melhor
# esforço" e atrasa sob carga. Medido em 40 execuções de */30, a mediana real
# ficou em 149 min e o pior intervalo em 776 min — 23 dos 39 intervalos foram
# maiores que a própria janela de aviso (2h), ou seja, mais da metade dos
# cortes podia passar sem lembrete nenhum.
#
# Fica de pé como rede de segurança, de hora em hora: se o cron-job.org cair,
# a cobertura piora mas não zera. `reminderSentAt` impede aviso repetido,
# então os dois disparando junto é inofensivo.
#
# De hora em hora também cabe folgado nos 2.000 min/mês do plano grátis
# (~720 min, contra ~1.440 quando era de 30 em 30).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}   # permite disparar na mão pelo site do GitHub

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chamar o endpoint de lembretes
        run: |
          resposta=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://barberpro-mauve.vercel.app/api/cron")
          codigo=$(echo "$resposta" | tail -n1)
          corpo=$(echo "$resposta" | sed '$d')
          echo "HTTP $codigo"
          echo "$corpo"
          if [ "$codigo" != "200" ]; then
            echo "::error::Endpoint de lembretes respondeu $codigo"
            exit 1
          fi
